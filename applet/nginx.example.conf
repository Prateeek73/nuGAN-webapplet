# Example Nginx config for nuGAN web applet production
# Place this in /etc/nginx/sites-available/nugan and symlink to sites-enabled

server {
    listen 80;
    server_name snowflake.sabu.mtu.edu;

    # Serve frontend static files
    root /path/to/nuGAN-webapplet/applet/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: increase upload size if needed
    client_max_body_size 20M;
}

# After editing, run:
# sudo ln -s /etc/nginx/sites-available/nugan /etc/nginx/sites-enabled/
# sudo systemctl reload nginx
